[package]
name = "tauri-plugin-kcp"
version = "0.1.0"
authors = [ "jwyxym" ]
description = "KCP Socket for Tauri App"
edition = "2021"
license = "MIT"
repository = "https://github.com/jwyxym/tauri-plugin-kcp"
keywords = ["tauri", "plugin", "kcp"]
exclude = ["/examples", "/webview-dist", "/webview-src", "node_modules"]
readme = "README.md"
links = "tauri-plugin-kcp"

[build-dependencies]
tauri-plugin = { version = "2.0.1", features = ["build"] }

[dependencies]
tauri = { version = "2.0.4" }
serde = "1.0"
thiserror = "1.0"
tokio = { version = "1.37.0", features = ["io-util", "net", "time"] }
tokio_kcp = "0.9.8"
lazy_static = "1.4.0"
debug_print = "1.0.0"
